name: ltesurvey CI

on:
  push:
    branches:
      - ltesurvey
      - 'ci/**'
      - 'feature/**'
  pull_request:
    branches:
      - ltesurvey
  workflow_dispatch:

jobs:
  macos-arm64-build:
    name: macOS ARM64 build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          uname -a
          test "$(uname -m)" = "arm64"

      - name: Install build dependencies
        run: |
          brew update
          brew install cmake fftw mbedtls@3 boost libconfig soapysdr hackrf soapyhackrf
          echo "PKG_CONFIG_PATH=$(brew --prefix mbedtls@3)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix mbedtls@3)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix mbedtls@3)/lib" >> "$GITHUB_ENV"

      - name: Configure ltesurvey targets
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_GUI=OFF \
            -DENABLE_SRSUE=OFF \
            -DENABLE_SRSENB=OFF \
            -DENABLE_SRSEPC=OFF \
            -DENABLE_UHD=OFF \
            -DENABLE_SOAPYSDR=ON \
            -DENABLE_WERROR=OFF

      - name: Build ltesurvey targets
        run: |
          cmake --build build --target pdsch_ue cell_search lte_scan --parallel "$(sysctl -n hw.ncpu)"

      - name: Basic CLI smoke tests
        run: |
          test -x build/lib/examples/pdsch_ue
          test -x build/lib/examples/cell_search
          find build -type f -perm -111 -name lte_scan -print -quit | grep -q .
